name: Bug report
description: Report incorrect reconciliation, verification, or API behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make RAG deletion safer.
  - type: input
    id: version
    attributes:
      label: VectorLedger version
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: connector
    attributes:
      label: Connector
      options: [PostgreSQL, Qdrant, Redis, Scheduled deletion / ACL, Control plane, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include minimal configuration, lifecycle event, expected state, and actual state.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or receipt
      description: Remove credentials and sensitive document content.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and sensitive content.
          required: true
