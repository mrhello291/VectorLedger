[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vectorledger"
version = "0.1.0"
description = "A vendor-neutral reconciliation and verification control plane for RAG data lifecycle changes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "VectorLedger contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "redis>=5,<7",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/mrhello291/VectorLedger"
Documentation = "https://github.com/mrhello291/VectorLedger/tree/main/docs"
Issues = "https://github.com/mrhello291/VectorLedger/issues"
Repository = "https://github.com/mrhello291/VectorLedger.git"

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
vectorledger = "vectorledger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vectorledger"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vectorledger"]
